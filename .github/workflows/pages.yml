# Deploys the portfolio to GitHub Pages.
#
# This exists as an alternative to the "Deploy from a branch" setting: with
# Settings -> Pages -> Source set to "GitHub Actions", this workflow publishes
# the repository root as a static site. There is no build step - the site is
# plain HTML, CSS and JS with no dependencies - so it just uploads and deploys.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
